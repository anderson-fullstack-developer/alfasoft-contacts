# Disposable database for the automated tests. Its data lives in memory and is lost on shutdown.
services:
  test-db:
    image: mariadb:10.11
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_DATABASE: contacts_test
      MARIADB_USER: contacts_test
      MARIADB_PASSWORD: contacts_test
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
